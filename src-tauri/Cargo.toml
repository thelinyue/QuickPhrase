[package]
name = "shanyu"
version = "0.1.1"
edition = "2021"
description = "闪语 Windows 本地话术工具"

[lib]
name = "shanyu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-single-instance = "2.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
calamine = "0.36.1"
rust_xlsxwriter = "0.99.1"
tempfile = "3.27.0"
log = { version = "0.4.34", features = ["std"] }
pinyin = "0.11.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
