# 仅允许在正式门禁满足后从不可变 tag 手动触发；禁止降级为未签名正式发布。
name: release-signed

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer
        required: true
        default: 0.0.1
      confirmWeComAcceptance:
        description: Confirm current WeCom manual matrix
        required: true
        type: boolean
        default: false
      confirmWin11Acceptance:
        description: Confirm Windows 11 installation matrix
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  sign-release:
    environment: production-signing
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate stable release gates
        run: |
          $version = '${{ inputs.version }}'
          if ($version -ne '0.0.1') { throw "当前正式发布仅允许 0.0.1：$version" }
          if ($env:GITHUB_REF -ne "refs/tags/v$version") { throw "必须从 refs/tags/v$version 手动运行，当前为 $env:GITHUB_REF。" }
          if ('${{ inputs.confirmWeComAcceptance }}' -ne 'true') { throw '尚未确认企业微信人工矩阵。' }
          if ('${{ inputs.confirmWin11Acceptance }}' -ne 'true') { throw '尚未确认 Windows 11 安装矩阵。' }
          "QUICKPHRASE_WECOM_ACCEPTANCE=passed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QUICKPHRASE_WIN11_ACCEPTANCE=passed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore QuickPhrase.sln

      - name: Install Inno Setup 6.7.3
        run: |
          $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            winget install --id JRSoftware.InnoSetup --version 6.7.3 --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup 6.7.3 安装失败，退出码 $LASTEXITCODE。" }
          }
          $listing = winget list --id JRSoftware.InnoSetup --exact --accept-source-agreements | Out-String
          if ($listing -notmatch '6\.7\.3') { throw "未检测到 Inno Setup 6.7.3：$listing" }

      - name: Build unsigned application signing input
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -Version '${{ inputs.version }}' -Stage Publish
          if ($LASTEXITCODE -ne 0) { throw "应用发布失败，退出码 $LASTEXITCODE。" }

      - name: Upload application signing input
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: QuickPhrase-${{ inputs.version }}-application-signing-input
          if-no-files-found: error
          retention-days: 7
          path: artifacts/release/${{ inputs.version }}/publish/

      - name: Sign QuickPhrase application binaries
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed-app

      - name: Verify signed application and timestamp
        run: |
          $exe = Get-ChildItem -LiteralPath artifacts/signed-app -Recurse -File -Filter QuickPhrase.exe | Select-Object -First 1
          if (-not $exe) { throw 'SignPath 输出缺少 QuickPhrase.exe。' }
          $root = $exe.Directory.FullName
          foreach ($name in @('QuickPhrase.exe', 'QuickPhrase.dll', 'QuickPhrase.Core.dll', 'QuickPhrase.Platform.Windows.dll')) {
            $path = Join-Path $root $name
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) {
              throw "应用签名或时间戳无效：$name；状态=$($signature.Status)"
            }
          }
          "SIGNED_PUBLISH_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer from signed application
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -Version '${{ inputs.version }}' -Stage Installer -PublishRootOverride $env:SIGNED_PUBLISH_ROOT
          if ($LASTEXITCODE -ne 0) { throw "安装器构建失败，退出码 $LASTEXITCODE。" }

      - name: Upload installer signing input
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: QuickPhrase-${{ inputs.version }}-installer-signing-input
          if-no-files-found: error
          retention-days: 7
          path: artifacts/release/${{ inputs.version }}/installers/QuickPhrase-Setup-${{ inputs.version }}.exe

      - name: Sign QuickPhrase installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed-installer

      - name: Verify signed installer and timestamp
        run: |
          $installer = Get-ChildItem -LiteralPath artifacts/signed-installer -Recurse -File -Filter 'QuickPhrase-Setup-${{ inputs.version }}.exe' | Select-Object -First 1
          if (-not $installer) { throw 'SignPath 输出缺少正式安装器。' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) {
            throw "安装器签名或时间戳无效；状态=$($signature.Status)"
          }
          "SIGNED_INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Finalize signed release bundle
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/finalize-signed-release.ps1 -Version '${{ inputs.version }}' -SignedPublishRoot $env:SIGNED_PUBLISH_ROOT -SignedInstallerPath $env:SIGNED_INSTALLER_PATH
          if ($LASTEXITCODE -ne 0) { throw "正式资产终验失败，退出码 $LASTEXITCODE。" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-phase6.ps1 -Version '${{ inputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw "Phase 6 正式门禁失败，退出码 $LASTEXITCODE。" }

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: QuickPhrase-${{ inputs.version }}-signed-release
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release/${{ inputs.version }}/QuickPhrase-${{ inputs.version }}-win-x64.zip
            artifacts/release/${{ inputs.version }}/installers/QuickPhrase-Setup-${{ inputs.version }}.exe
            artifacts/release/${{ inputs.version }}/SHA256SUMS.txt
            artifacts/release/${{ inputs.version }}/release-manifest.json