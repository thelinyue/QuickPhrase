# 正式发布手动检出已有版本标签，保留自动检查和未签名声明。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer
        required: true
        default: 0.2.9

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - name: Validate stable release requirements
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/check-release.ps1 -Version $env:RELEASE_VERSION -Channel stable -GitRef "refs/tags/v$env:RELEASE_VERSION"

  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      sourceRef: refs/tags/v${{ inputs.version }}

  publish-release:
    needs: [validate, quality]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0

      - name: Setup Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Inno Setup 6.7.3
        run: |
          # Chocolatey 尚无该版本；官网下载指向此官方资产，执行前核对厂商签名。
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          curl.exe --fail --location --silent --show-error --retry 2 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' --output $setup
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 官方下载失败。' }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw 'Inno Setup 厂商签名校验失败。' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', ('/DIR="' + $compilerRoot + '"'), '/TASKS=') -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'Inno Setup 6.7.3 安装失败。' }
          "INNOSETUP_ISCC=$(Join-Path $compilerRoot 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate and build unsigned release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/check-release.ps1 -Version $env:RELEASE_VERSION -Channel stable -GitRef "refs/tags/v$env:RELEASE_VERSION"
          ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Sign and package update assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          QUICKPHRASE_UPDATE_PRIVATE_KEY: ${{ secrets.QUICKPHRASE_UPDATE_PRIVATE_KEY }}
          QUICKPHRASE_UPDATE_KEY_PASSWORD: ${{ secrets.QUICKPHRASE_UPDATE_KEY_PASSWORD }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: QuickPhrase-${{ inputs.version }}-unsigned
          if-no-files-found: error
          path: |
            artifacts/release/${{ inputs.version }}/QuickPhrase-${{ inputs.version }}-win-x64.zip
            artifacts/release/${{ inputs.version }}/QuickPhrase-Setup-${{ inputs.version }}-x64.exe
            artifacts/release/${{ inputs.version }}/SHA256SUMS.txt
            artifacts/release/${{ inputs.version }}/SHA256SUMS.txt.minisig
            artifacts/release/${{ inputs.version }}/release-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $root = Join-Path 'artifacts/release' $env:RELEASE_VERSION
          $assets = @((Join-Path $root "QuickPhrase-$env:RELEASE_VERSION-win-x64.zip"), (Join-Path $root "QuickPhrase-Setup-$env:RELEASE_VERSION-x64.exe"), (Join-Path $root 'SHA256SUMS.txt'), (Join-Path $root 'SHA256SUMS.txt.minisig'), (Join-Path $root 'release-manifest.json'))
          # 使用标签内的版本说明，公开支持范围、验收边界和未签名状态。
          $notes = Join-Path 'docs/releases' "v$env:RELEASE_VERSION.md"
          gh release create "v$env:RELEASE_VERSION" @assets --verify-tag --title "闪语 QuickPhrase v$env:RELEASE_VERSION" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败；未覆盖已有标签或资产。' }
