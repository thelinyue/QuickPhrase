# 正式发布只允许从已有版本标签手动触发，保留人工验收和未签名声明。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer
        required: true
        default: 0.1.1
      confirmWeComAcceptance:
        description: Confirm current WeCom manual matrix
        required: true
        type: boolean
        default: false
      confirmWin11Acceptance:
        description: Confirm Windows 11 installation matrix
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate stable release requirements
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFIRM_WECOM: ${{ inputs.confirmWeComAcceptance }}
          CONFIRM_WIN11: ${{ inputs.confirmWin11Acceptance }}
        run: |
          ./scripts/check-release.ps1 -Version $env:RELEASE_VERSION -Channel stable -GitRef $env:GITHUB_REF -ConfirmWeComAcceptance:($env:CONFIRM_WECOM -eq 'true') -ConfirmWin11Acceptance:($env:CONFIRM_WIN11 -eq 'true')

  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish-release:
    needs: [validate, quality]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Inno Setup 6.7.3
        run: |
          choco install innosetup --version=6.7.3 --yes --no-progress --force
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 6.7.3 安装失败。' }

      - name: Validate and build unsigned release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFIRM_WECOM: ${{ inputs.confirmWeComAcceptance }}
          CONFIRM_WIN11: ${{ inputs.confirmWin11Acceptance }}
        run: |
          ./scripts/check-release.ps1 -Version $env:RELEASE_VERSION -Channel stable -GitRef $env:GITHUB_REF -ConfirmWeComAcceptance:($env:CONFIRM_WECOM -eq 'true') -ConfirmWin11Acceptance:($env:CONFIRM_WIN11 -eq 'true')
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION -InnoCompiler $compiler
          ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Shanyu-${{ inputs.version }}-unsigned
          if-no-files-found: error
          path: |
            artifacts/release/${{ inputs.version }}/Shanyu-${{ inputs.version }}-win-x64.zip
            artifacts/release/${{ inputs.version }}/Shanyu-Setup-${{ inputs.version }}-x64.exe
            artifacts/release/${{ inputs.version }}/SHA256SUMS.txt
            artifacts/release/${{ inputs.version }}/release-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $root = Join-Path 'artifacts/release' $env:RELEASE_VERSION
          $assets = @((Join-Path $root "Shanyu-$env:RELEASE_VERSION-win-x64.zip"), (Join-Path $root "Shanyu-Setup-$env:RELEASE_VERSION-x64.exe"), (Join-Path $root 'SHA256SUMS.txt'), (Join-Path $root 'release-manifest.json'))
          # 使用标签内的版本说明，公开支持范围、验收边界和未签名状态。
          $notes = Join-Path 'docs/releases' "v$env:RELEASE_VERSION.md"
          gh release create "v$env:RELEASE_VERSION" @assets --verify-tag --title "闪语 v$env:RELEASE_VERSION" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败；未覆盖已有标签或资产。' }
