# 候选只保存 Actions artifact，不创建标签或 GitHub Release。
name: release-candidate-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate SemVer
        required: true
        default: 0.1.3-rc.1
      confirmWeComAcceptance:
        description: Confirm current WeCom manual matrix
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate candidate requirements
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFIRM_WECOM: ${{ inputs.confirmWeComAcceptance }}
        run: |
          ./scripts/check-release.ps1 -Version $env:RELEASE_VERSION -Channel prerelease -GitRef $env:GITHUB_REF -ConfirmWeComAcceptance:($env:CONFIRM_WECOM -eq 'true')

  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build-unsigned-candidate:
    needs: [validate, quality]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Inno Setup 6.7.3
        run: |
          # Chocolatey 尚无该版本；官网下载指向此官方资产，执行前核对厂商签名。
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          curl.exe --fail --location --silent --show-error --retry 2 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' --output $setup
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 官方下载失败。' }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw 'Inno Setup 厂商签名校验失败。' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', ('/DIR="' + $compilerRoot + '"'), '/TASKS=') -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'Inno Setup 6.7.3 安装失败。' }
          "INNOSETUP_ISCC=$(Join-Path $compilerRoot 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and package unsigned candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFIRM_WECOM: ${{ inputs.confirmWeComAcceptance }}
        run: |
          ./scripts/check-release.ps1 -Version $env:RELEASE_VERSION -Channel prerelease -GitRef $env:GITHUB_REF -ConfirmWeComAcceptance:($env:CONFIRM_WECOM -eq 'true')
          ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION
          ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload unsigned candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: Shanyu-${{ inputs.version }}-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release/${{ inputs.version }}/Shanyu-${{ inputs.version }}-win-x64.zip
            artifacts/release/${{ inputs.version }}/Shanyu-Setup-${{ inputs.version }}-x64.exe
            artifacts/release/${{ inputs.version }}/SHA256SUMS.txt
            artifacts/release/${{ inputs.version }}/release-manifest.json
