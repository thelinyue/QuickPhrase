name: windows-ci

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sourceRef:
        description: Source ref to check out for release validation
        required: false
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  quality-gates:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sourceRef || github.ref }}

      - name: Setup Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend tests
        run: npm test

      - name: Installer script tests
        run: npm run test:release

      - name: TypeScript and frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Debug client build
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
