name: windows-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  quality-gates:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore QuickPhrase.sln

      - name: Debug build
        run: dotnet build QuickPhrase.sln -c Debug --no-restore --verbosity minimal

      - name: Debug tests
        run: dotnet test QuickPhrase.sln -c Debug --no-build --verbosity minimal

      - name: Release build
        run: dotnet build QuickPhrase.sln -c Release --no-restore --verbosity minimal

      - name: Release tests
        run: dotnet test QuickPhrase.sln -c Release --no-build --verbosity minimal

      - name: Native Launcher smoke
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-launcher-smoke.ps1 -Mode Native -Configuration Release

      - name: Launcher hot-call performance gate
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-launcher-smoke.ps1 -Mode Performance -Configuration Release